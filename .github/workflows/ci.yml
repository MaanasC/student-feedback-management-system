name: CI/CD Pipeline - Build, Test & Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Verify Full-Stack System
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Seed Database
        env:
          MONGODB_URI: mongodb://localhost:27017/StudentFeedbackDB
          JWT_SECRET: ci_test_jwt_secret_key_2026
        run: npm run seed

      - name: Run Backend Test Verification Suite (Exp 5, 6, 7 & Validation)
        env:
          MONGODB_URI: mongodb://localhost:27017/StudentFeedbackDB
          JWT_SECRET: ci_test_jwt_secret_key_2026
          PORT: 5000
        run: npm run test:backend

      - name: Build React Production Frontend
        run: npm run build
